apiVersion: 1
datasources:
  - name: Wagering metrics
    uid: wagering-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Wagering traces
    uid: wagering-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

