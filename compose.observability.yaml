services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=24h"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    profiles: [observability]
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:3200:3200"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: [observability]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/wagering.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/wagering.yaml:ro
      - ./observability/wagering-dashboard.json:/var/lib/grafana/dashboards/wagering.json:ro

